# Firmware for RSD on the board. `cargo run -p hello` loads it, runs it and
# prints its serial output (scripts/run.sh).
[workspace]
resolver = "2"
members  = ["bsp", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
rsd-bsp = { path = "bsp" }

[profile.dev]
# opt-level 0 is large and slow.
opt-level       = 1
debug           = 2
overflow-checks = true

[profile.release]
opt-level     = "s"
debug         = 2
lto           = true
codegen-units = 1
